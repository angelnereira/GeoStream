# GeoStream — Nginx de referencia (NFR-SEC-001, docs/16 §2.3)
#
# Equivalente funcional a deploy/caddy/Caddyfile. Nginx requiere que el operador gestione los
# certificados (por ejemplo con certbot) y que se use HTTP/1.1 con Upgrade para el stream.
#
# Incluir desde el bloque http de nginx.conf:
#   include /etc/nginx/conf.d/geostream.conf;

# Límite de cuerpo mayor o igual que GS_REST_MAX_BODY_BYTES (65536 bytes por defecto).
# El valor por defecto de Nginx es 1 MB, que cubre todo el rango normativo.
# client_max_body_size 1m;

# Upgrade de WebSocket: el mapa es obligatorio para que Connection dependa del cliente.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

upstream geostream_api {
	# Sin afinidad de sesión: todas las instancias son elegibles (docs/16 §2.3).
	server 127.0.0.1:8080;
	keepalive 16;
}

server {
	listen 443 ssl;
	http2 on;
	server_name geostream.example.com;

	# TLS 1.2 o superior (docs/16 §2.3).
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:geostream_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;
	# El operador coloca aquí sus certificados.
	ssl_certificate     /etc/nginx/certs/geostream.example.com.crt;
	ssl_certificate_key /etc/nginx/certs/geostream.example.com.key;

	# HSTS en el despliegue público (docs/16 §2.3).
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options nosniff always;

	# Sin caché en las respuestas versionadas (docs/07 §1).
	add_header Cache-Control "no-store" always;

	# El proxy nunca debe cerrar antes que el idle timeout del stream:
	# mayor que GS_STREAM_IDLE_TIMEOUT_MS + margen (mínimo recomendado 90 s).
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	keepalive_timeout 3600s;

	location / {
		proxy_pass http://geostream_api;
		proxy_http_version 1.1;

		# Cabeceras de proxy que el servidor solo confía con GS_TRUST_PROXY_HEADERS=true.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $host;

		# WebSocket (docs/08 §2).
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}

server {
	listen 80;
	server_name geostream.example.com;

	# Redirección permanente a HTTPS.
	return 301 https://$host$request_uri;
}
