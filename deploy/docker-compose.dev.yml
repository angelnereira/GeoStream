# GeoStream — Entorno de desarrollo local (PostgreSQL 16 + Valkey 7.2)
# Referencia: docs/16_OPERATIONS.md §10, docs/17_CONFIGURATION.md

name: geostream-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: geostream-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geostream
      POSTGRES_PASSWORD: geostream_dev_password
      POSTGRES_DB: geostream_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geostream -d geostream_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: geostream-dev-valkey
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: geostream_dev_postgres_data
