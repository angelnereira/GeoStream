[package]
name = "gs-ffi"
description = "C ABI surface (and only surface with unsafe) over gs-client-runtime. ADR-0031 / 26 §3.2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gs-client-core.workspace = true
gs-client-runtime.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }