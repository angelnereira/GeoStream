# CI de GeoStream.
# Las etapas se describen en docs/18_TESTING_STRATEGY.md §10.1.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stage1-fmt-lint:
    name: "Etapa 1: Formato y Lint (cargo fmt, clippy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust toolchain
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  stage2-contracts:
    name: "Etapa 2: Contratos (buf lint, redocly, JSON)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: buf lint
        run: buf lint contracts/proto
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Redocly lint OpenAPI
        run: npx --yes @redocly/cli@2.62.1 lint contracts/openapi/geostream.v1.yaml --config contracts/openapi/redocly.yaml
      - name: Validar JSON de contratos
        run: cargo run -p geostream-tools -- json

  stage3-doc-consistency:
    name: "Etapa 3: Consistencia Documental (geostream-tools)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust toolchain
        run: rustup show
      - name: Ejecutar checks de consistencia documental en Rust
        run: cargo run -p geostream-tools -- all

  stage4-tests:
    name: "Etapa 4: Pruebas automatizadas"
    runs-on: ubuntu-latest
    # Las pruebas de gs-store, gs-api, gs-stream y gs-testkit usan PostgreSQL real, y las de
    # gs-ephemeral y gs-bus, Redis/Valkey real (T-F6-01). Mismas imágenes que deploy/docker-compose.dev.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geostream
          POSTGRES_PASSWORD: geostream_dev_password
          POSTGRES_DB: geostream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geostream -d geostream_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GS_DATABASE_URL: postgres://geostream:geostream_dev_password@127.0.0.1:5432/geostream_test
      GS_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust toolchain
        run: rustup show
      - name: Ejecutar pruebas
        run: cargo test --workspace --all-features

  stage5-multiarch:
    name: "Etapa 5: Compilacion multiplataforma (FR-OPS-007, T-E1-05)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: rustup show
      - name: Instalar target
        run: rustup target add ${{ matrix.target }}
      - name: Compilar crates puros al target (wasm-safe)
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo build -p gs-geo -p gs-client-core --target wasm32-unknown-unknown
      - name: Compilar workspace al target (musl)
        if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo build --workspace --target ${{ matrix.target }} --all-features --exclude gs-client-runtime --exclude gs-ffi

  stage5-ffi-abi:
    name: "Etapa 5c: ABI C de gs-ffi (E9)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: rustup show
      - name: Construir la cdylib
        run: cargo build -p gs-ffi --release
      - name: Compilar y ejecutar el consumidor C
        run: |
          cc crates/gs-ffi/tests/c/abi_smoke.c \
             -I crates/gs-ffi/include \
             -L target/release -lgs_ffi \
             -o /tmp/abi_smoke
          LD_LIBRARY_PATH=target/release /tmp/abi_smoke

  stage5-docker:
    name: "Etapa 5b: Imagen Docker all-in-one"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -f deploy/Dockerfile -t geostream:ci .
      - name: Smoke test (servicio real con postgres + redis embebidos)
        run: deploy/smoke.sh 8090 geostream:ci

  stage5-security:
    name: "Etapa 5: Seguridad (cargo deny, cargo audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-tools-deny-0.20.2-audit-0.22.2
      - name: Instalar cargo-deny y cargo-audit
        run: |
          which cargo-deny || cargo install --locked cargo-deny@0.20.2
          which cargo-audit || cargo install --locked cargo-audit@0.22.2
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
