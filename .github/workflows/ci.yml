# CI de GeoStream. Las etapas se describen en docs/18_TESTING_STRATEGY.md §10.1.
# Por ahora solo existe la etapa 5 (seguridad, T-F0-02); T-F0-05 añade las etapas 1, 2 y 3.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Seguridad (cargo deny, cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versiones fijadas (docs/19_ENGINEERING_STANDARDS.md §6.4).
      - name: Instalar cargo-deny y cargo-audit
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
