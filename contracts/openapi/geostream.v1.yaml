openapi: 3.1.0
info:
  title: GeoStream API
  version: 1.0.0-draft.2
  summary: Plano de control REST, emisión de credenciales y webhooks de GeoStream v1.
  description: |
    Contrato máquina normativo de la API REST v1 de GeoStream.

    - Semántica: docs/07_REST_API.md. Validación: docs/09_VALIDATION_ERRORS.md. Autorización: docs/06_IDENTITY_AUTH.md.
    - Extensiones propias:
      - `x-gs-phase`: fase del roadmap en la que la operación debe existir.
      - `x-gs-auth.application` / `x-gs-auth.device`: scope requerido para ese principal;
        `none` = permitido sin scope adicional; `forbidden` = principal no permitido.
      - `x-gs-capability`: capacidad requerida en la sesión cuando el principal es un dispositivo.
    - Enums REST: nombre del valor Protobuf sin el prefijo del enum (SESSION_MODE_ONE_TO_ONE -> ONE_TO_ONE).
    - Estado: borrador hasta el hito M2; desde M2 los cambios incompatibles requieren /v2.
servers:
  - url: https://geostream.example.com
    description: Ejemplo. Sustituir por el host del despliegue.
tags:
  - name: Credentials
    description: Tokens de dispositivo y tickets de stream.
  - name: Sessions
    description: Ciclo de vida de sesiones de compartición.
  - name: Members
    description: 'Membresías, capacidades y compartición.'
  - name: Invitations
    description: Invitaciones canjeables por código.
  - name: Locations
    description: Snapshot e ingesta HTTP de ubicaciones.
  - name: Subjects
    description: 'Subjects del integrador (consulta, revocación, borrado y exportación).'
  - name: Devices
    description: Dispositivos (instalaciones) de un subject.
  - name: Webhooks
    description: Endpoints de webhooks firmados.
  - name: Geofences
    description: Geocercas de tenant o de sesión (F11).
  - name: Health
    description: Liveness y readiness.
paths:
  /health/live:
    get:
      operationId: healthLive
      tags: [Health]
      summary: Liveness del proceso.
      x-gs-phase: F2
      x-gs-auth: { application: none, device: none }
      security: []
      responses:
        '200':
          description: El proceso responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      operationId: healthReady
      tags: [Health]
      summary: Readiness (dependencias disponibles, no drenando).
      x-gs-phase: F2
      x-gs-auth: { application: none, device: none }
      security: []
      responses:
        '200':
          description: Lista para recibir tráfico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: No lista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }

  /v1/tokens:
    post:
      operationId: mintToken
      tags: [Credentials]
      summary: Emitir un token de dispositivo para un subject.
      description: Crea o reutiliza el subject y el dispositivo. Solo server-to-server con API key.
      x-gs-phase: F2
      x-gs-auth: { application: 'tokens:mint', device: forbidden }
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Token emitido.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/stream/tickets:
    post:
      operationId: createStreamTicket
      tags: [Credentials]
      summary: Emitir un ticket de un solo uso para abrir el stream.
      x-gs-phase: F4
      x-gs-auth: { application: 'stream:connect', device: 'stream:connect' }
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '201':
          description: Ticket emitido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamTicketResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/stream:
    get:
      operationId: openStream
      tags: [Credentials]
      summary: Upgrade a WebSocket (protocolo en docs/08_STREAM_PROTOCOL.md).
      description: |
        No es una operación REST: es el handshake WebSocket. Requiere `Upgrade: websocket` y
        `Sec-WebSocket-Protocol` con `gs.v1.proto` y/o `gs.v1.json`. El ticket autentica la conexión.
      x-gs-phase: F4
      x-gs-auth: { application: 'stream:connect', device: 'stream:connect' }
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          description: Ticket `gst_…` de un solo uso. Se redacta en todos los logs.
          schema: { $ref: '#/components/schemas/StreamTicket' }
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            examples: ['gs.v1.proto, gs.v1.json']
      responses:
        '101':
          description: Switching Protocols. Continúa el protocolo de stream.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Crear una sesión.
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:write', device: 'sessions:create' }
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Sesión creada.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: Listar sesiones visibles para el principal.
      description: Dispositivo = sesiones donde su subject es miembro activo. Aplicación = sesiones del tenant.
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:read', device: none }
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SessionStatus' }
        - name: external_subject_id
          in: query
          required: false
          description: Solo aplicación. Sesiones donde ese subject es miembro activo.
          schema: { $ref: '#/components/schemas/ExternalSubjectId' }
      responses:
        '200':
          description: Página de sesiones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Obtener una sesión.
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:read', device: none }
      x-gs-capability: active_member
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '200':
          description: Sesión.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateSession
      tags: [Sessions]
      summary: Actualizar una sesión activa.
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:write', device: none }
      x-gs-capability: manage
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSessionRequest' }
      responses:
        '200':
          description: Sesión actualizada.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/close:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      operationId: closeSession
      tags: [Sessions]
      summary: Cerrar una sesión (idempotente).
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:write', device: none }
      x-gs-capability: manage
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sesión cerrada (o ya cerrada/expirada).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/leave:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      operationId: leaveSession
      tags: [Members]
      summary: El dispositivo abandona la sesión en nombre de su subject.
      x-gs-phase: F3
      x-gs-auth: { application: forbidden, device: none }
      x-gs-capability: active_member
      security:
        - deviceToken: []
      responses:
        '204':
          description: Membresía terminada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/members:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: listMembers
      tags: [Members]
      summary: Listar miembros activos con su estado.
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:read', device: none }
      x-gs-capability: read_or_manage
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de miembros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: addMember
      tags: [Members]
      summary: Agregar un subject como miembro (solo aplicación).
      x-gs-phase: F3
      x-gs-auth: { application: 'members:write', device: forbidden }
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Miembro agregado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/MemberIdOrMePath'
    get:
      operationId: getMember
      tags: [Members]
      summary: Obtener un miembro (o `me`).
      x-gs-phase: F3
      x-gs-auth: { application: 'sessions:read', device: none }
      x-gs-capability: read_or_manage_or_self
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '200':
          description: Miembro.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateMember
      tags: [Members]
      summary: Cambiar capacidades o rol de un miembro.
      x-gs-phase: F3
      x-gs-auth: { application: 'members:write', device: none }
      x-gs-capability: manage
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: Miembro actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: revokeMember
      tags: [Members]
      summary: Revocar un miembro.
      x-gs-phase: F3
      x-gs-auth: { application: 'members:write', device: none }
      x-gs-capability: manage
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '204':
          description: Miembro revocado (idempotente si ya estaba revocado).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/members/{member_id}/sharing:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/MemberIdOrMePath'
    put:
      operationId: setSharing
      tags: [Members]
      summary: Activar o detener la compartición de ubicación.
      description: |
        `sharing=true` solo para `member_id=me` desde un dispositivo con capacidad `publish`.
        `sharing=false` para `me`, para miembros con `manage`, o por la aplicación.
      x-gs-phase: F3
      x-gs-auth: { application: 'members:write', device: 'sharing:write' }
      x-gs-capability: self_publish_or_manage
      security:
        - applicationKey: []
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharingRequest' }
      responses:
        '200':
          description: Estado de compartición aplicado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    post:
      operationId: createInvitation
      tags: [Invitations]
      summary: Crear una invitación. El código se devuelve una sola vez.
      x-gs-phase: F3
      x-gs-auth: { application: 'invitations:write', device: none }
      x-gs-capability: invite
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Invitación creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listInvitations
      tags: [Invitations]
      summary: Listar invitaciones (sin códigos).
      x-gs-phase: F3
      x-gs-auth: { application: 'invitations:write', device: none }
      x-gs-capability: manage_or_invite_own
      security:
        - applicationKey: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Página de invitaciones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
      - $ref: '#/components/parameters/InvitationIdPath'
    delete:
      operationId: revokeInvitation
      tags: [Invitations]
      summary: Revocar una invitación (idempotente).
      x-gs-phase: F3
      x-gs-auth: { application: 'invitations:write', device: none }
      x-gs-capability: manage_or_issuer
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '204':
          description: Invitación revocada.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/invitations/redeem:
    post:
      operationId: redeemInvitation
      tags: [Invitations]
      summary: Canjear un código de invitación.
      x-gs-phase: F3
      x-gs-auth: { application: forbidden, device: 'invitations:redeem' }
      security:
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemInvitationRequest' }
      responses:
        '201':
          description: Membresía creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemInvitationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sessions/{session_id}/snapshot:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getSnapshot
      tags: [Locations]
      summary: Últimas ubicaciones retenidas de los miembros que comparten.
      x-gs-phase: F4
      x-gs-auth: { application: 'locations:read', device: none }
      x-gs-capability: read
      security:
        - applicationKey: []
        - deviceToken: []
      responses:
        '200':
