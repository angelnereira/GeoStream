# ==========================================================================
  # Pista E — motor de ubicación y movilidad.
  #
  # Todas estas operaciones son ADITIVAS bajo /v1 (docs/07_REST_API.md §11):
  # no renumeran ni rompen ningún campo existente. Un cliente escrito antes de
  # la pista E sigue funcionando sin cambios (NFR-COMPAT-003).
  #
  # Cada capacidad nueva está detrás de su interruptor de política del tenant
  # (docs/17_CONFIGURATION.md §4.1). Sin él, la respuesta es 403 FEATURE_DISABLED:
  # el permiso es correcto, la capacidad no está contratada.
  # ==========================================================================

  /v1/pools:
    post:
      operationId: createPool
      tags: [Pools]
      summary: Crear un pool de disponibilidad.
      description: |
        Alias de sugar sintáctico de `POST /v1/sessions` con `mode = POOL` forzado.
        No duplica reglas: la respuesta es la misma `Session` con su `ETag`.

        Un pool es una sesión de disponibilidad, no un concepto nuevo: reutiliza
        membresías, consentimiento, revocación en vivo, publicador único,
        secuencias y snapshot (docs/05_DOMAIN_MODEL.md §4.2.1).

        En un pool, ningún miembro **dispositivo** puede tener `read`, `invite` ni
        `manage` (INV-POOL-1): los conductores no se ven entre sí.
      x-gs-phase: E0
      x-gs-auth: { application: 'pools:manage', device: forbidden }
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePoolRequest' }
      responses:
        '201':
          description: Pool creado.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/pools/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getPool
      tags: [Pools]
      summary: Obtener un pool (su `Session` con `mode = POOL`).
      x-gs-phase: E0
      x-gs-auth: { application: 'sessions:read', device: forbidden }
      security:
        - applicationKey: []
      responses:
        '200':
          description: Pool.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/pools/{session_id}/nearby:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getPoolNearby
      tags: [Pools]
      summary: Miembros conectados cerca de un punto.
      description: |
        Solo aplicación. Con `rank = eta` se aplica el prefiltrado
        `pool_eta_prefilter` antes de estimar el tiempo de llegada.

        Devuelve `member_id`, `distance_m`, `age_ms`, `availability`, `attributes`,
        `position` y, con `rank = eta`, `eta_s` y `mode`. Excluye a quien está
        `PAUSED` o desconectado, salvo que `max_age_s` lo permita explícitamente.
      x-gs-phase: E0
      x-gs-auth: { application: 'pools:query', device: forbidden }
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - name: radius_m
          in: query
          required: true
          schema: { type: number, format: double, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: rank
          in: query
          required: false
          schema: { type: string, enum: [distance, eta], default: distance }
        - name: max_age_s
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: filter.attributes
          in: query
          required: false
          description: Filtro de igualdad sobre atributos; hasta 3 claves `k=v` separadas por `&`.
          schema: { type: string }
      responses:
        '200':
          description: Miembros cercanos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/pools/{session_id}/rings:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getPoolRings
      tags: [Pools]
      summary: Anillos concéntricos de miembros alrededor de un punto.
      description: Exactamente uno de `ring_step_m` o `k`. `per_ring_limit` acota cada anillo.
      x-gs-phase: E0
      x-gs-auth: { application: 'pools:query', device: forbidden }
      security:
        - applicationKey: []
      parameters:
        - $ref: '#/components/parameters/Latitude'
        - $ref: '#/components/parameters/Longitude'
        - name: ring_step_m
          in: query
          required: false
          schema: { type: number, format: double, minimum: 1 }
        - name: k
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: per_ring_limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Anillos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/pools/{session_id}/density:
    parameters:
      - $ref: '#/components/parameters/SessionIdPath'
    get:
      operationId: getPoolDensity
      tags: [Pools]
      summary: Marcadores aproximados y anónimos de densidad.
      description: |
        Única consulta de pool accesible a un dispositivo, y existe precisamente
        para que un pasajero NO necesite ver conductores individuales (FR-POOL-006).

