        - name: to
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: simplify_m
          in: query
          required: false
          schema: { type: number, format: double, minimum: 0, maximum: 1000, default: 0 }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, polyline, gsp1], default: json }
