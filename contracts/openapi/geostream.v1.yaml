      description: |
        `format = gsp1` devuelve la polilínea en formato compacto;
        `simplify_m` aplica Douglas-Peucker. La simplificación nunca aumenta la
        tolerancia de `trip_simplify_tolerance_m` por debajo de lo acordado.

        Un dispositivo solo puede leer la traza de una sesión donde es miembro con
        `read`, la sesión está `ACTIVE` y `HISTORY` está en sus `consent_purposes`.
      x-gs-phase: E0
      x-gs-auth: { application: 'history:read', device: none }
